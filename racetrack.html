<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Racetrack</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      font-family: Arial, Helvetica, sans-serif;
    }
    #hud {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      text-align: center;
      pointer-events: none;
      color: #fff;
      text-shadow: 0 2px 4px rgba(0, 0, 0, 0.8);
    }
    #timer {
      font-size: 48px;
      font-weight: bold;
      margin-top: 10px;
    }
    #status {
      font-size: 18px;
      margin-top: 4px;
    }
    #progress {
      margin: 10px auto 0;
      width: 280px;
      height: 10px;
      background: rgba(0, 0, 0, 0.5);
      border-radius: 5px;
      overflow: hidden;
    }
    #bar {
      height: 100%;
      width: 0%;
      background: #4caf50;
      transition: width 0.1s linear;
    }
  </style>
</head>
<body>
  <div id="hud">
    <div id="timer">0.00s</div>
    <div id="status">Use WASD to drive</div>
    <div id="progress"><div id="bar"></div></div>
  </div>

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
      }
    }
  </script>

  <script type="module">
    import * as THREE from 'three';

    // ---------- Scene, camera, renderer ----------
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x87ceeb);
    scene.fog = new THREE.Fog(0x87ceeb, 90, 400);

    const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(innerWidth, innerHeight);
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    document.body.appendChild(renderer.domElement);

    // ---------- Lights ----------
    scene.add(new THREE.HemisphereLight(0xffffff, 0x557733, 0.9));
    const sun = new THREE.DirectionalLight(0xffffff, 1.4);
    sun.position.set(60, 110, 40);
    sun.castShadow = true;
    sun.shadow.mapSize.set(2048, 2048);
    sun.shadow.camera.left = -160;
    sun.shadow.camera.right = 160;
    sun.shadow.camera.top = 160;
    sun.shadow.camera.bottom = -160;
    sun.shadow.camera.near = 1;
    sun.shadow.camera.far = 400;
    sun.shadow.bias = -0.0005;
    sun.shadow.camera.updateProjectionMatrix();
    scene.add(sun);

    // ---------- Ground ----------
    const ground = new THREE.Mesh(
      new THREE.PlaneGeometry(600, 600),
      new THREE.MeshStandardMaterial({ color: 0x4a8f3c, roughness: 1 })
    );
    ground.rotation.x = -Math.PI / 2;
    ground.position.y = -0.01;
    ground.receiveShadow = true;
    scene.add(ground);

    // ---------- Track (a unique, winding loop) ----------
    const trackPts = [
      [0, 0],
      [25, 5],
      [45, -15],
      [40, -45],
      [60, -70],
      [30, -95],
      [-5, -80],
      [-30, -95],
      [-60, -70],
      [-45, -40],
      [-55, -10],
      [-35, 15],
      [-15, 35],
      [5, 20],
    ].map(p => new THREE.Vector3(p[0], 0, p[1]));

    const curve = new THREE.CatmullRomCurve3(trackPts, true, 'catmullrom', 0.5);
    const roadWidth = 10;

    function ribbon(curve, width, y, material, samples = 600) {
      const pos = [], idx = [];
      for (let i = 0; i <= samples; i++) {
        const t = i / samples;
        const p = curve.getPointAt(t);
        const tan = curve.getTangentAt(t);
        const perp = new THREE.Vector3(-tan.z, 0, tan.x).normalize();
        const L = p.clone().addScaledVector(perp, width / 2);
        const R = p.clone().addScaledVector(perp, -width / 2);
        pos.push(L.x, y, L.z, R.x, y, R.z);
        if (i < samples) {
          const a = i * 2, b = i * 2 + 1, c = i * 2 + 2, d = i * 2 + 3;
          idx.push(a, b, d, a, d, c);
        }
      }
      const geo = new THREE.BufferGeometry();
      geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
      geo.setIndex(idx);
      geo.computeVertexNormals();
      return new THREE.Mesh(geo, material);
    }

    const edge = ribbon(curve, roadWidth + 0.8, 0.02, new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.7 }));
    const road = ribbon(curve, roadWidth, 0.03, new THREE.MeshStandardMaterial({ color: 0x3a3a3a, roughness: 0.9 }));
    edge.receiveShadow = true;
    road.receiveShadow = true;
    scene.add(edge, road);

    // ---------- Start / finish checkered line ----------
    const sfPoint = curve.getPointAt(0);
    const sfTan = curve.getTangentAt(0);
    const sfHeading = Math.atan2(sfTan.x, sfTan.z);

    const chk = document.createElement('canvas');
    chk.width = 64; chk.height = 64;
    const cc = chk.getContext('2d');
    const cs = 8;
    for (let y = 0; y < 8; y++) {
      for (let x = 0; x < 8; x++) {
        cc.fillStyle = (x + y) % 2 ? '#ffffff' : '#000000';
        cc.fillRect(x * cs, y * cs, cs, cs);
      }
    }
    const chkTex = new THREE.CanvasTexture(chk);

    const sfGroup = new THREE.Group();
    const sfStrip = new THREE.Mesh(
      new THREE.PlaneGeometry(roadWidth, 2.4),
      new THREE.MeshBasicMaterial({ map: chkTex })
    );
    sfStrip.rotation.x = -Math.PI / 2;
    sfStrip.receiveShadow = true;
    sfGroup.add(sfStrip);
    sfGroup.rotation.y = sfHeading;
    sfGroup.position.set(sfPoint.x, 0.05, sfPoint.z);
    scene.add(sfGroup);

    // ---------- Trees for scenery ----------
    const trackSamples = [];
    for (let i = 0; i < 400; i++) trackSamples.push(curve.getPointAt(i / 400));

    function addTree(x, z) {
      const g = new THREE.Group();
      const trunk = new THREE.Mesh(
        new THREE.CylinderGeometry(0.3, 0.45, 2.2, 8),
        new THREE.MeshStandardMaterial({ color: 0x7a5230, roughness: 1 })
      );
      trunk.position.y = 1.1;
      trunk.castShadow = true;
      const top = new THREE.Mesh(
        new THREE.ConeGeometry(1.5, 3.4, 8),
        new THREE.MeshStandardMaterial({ color: 0x2e7d32, roughness: 1 })
      );
      top.position.y = 3.4;
      top.castShadow = true;
      g.add(trunk, top);
      g.position.set(x, 0, z);
      scene.add(g);
    }

    let placed = 0, attempts = 0;
    while (placed < 30 && attempts < 3000) {
      attempts++;
      const x = (Math.random() - 0.5) * 180;
      const z = (Math.random() - 0.5) * 180;
      let min = Infinity;
      for (const s of trackSamples) {
        const d = (x - s.x) ** 2 + (z - s.z) ** 2;
        if (d < min) min = d;
      }
      if (Math.sqrt(min) > 18) { addTree(x, z); placed++; }
    }

    // ---------- Car ----------
    const carGroup = new THREE.Group();
    const red = new THREE.MeshStandardMaterial({ color: 0xd01f1f, roughness: 0.3, metalness: 0.2 });
    const white = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.3, metalness: 0.2 });
    const dark = new THREE.MeshStandardMaterial({ color: 0x1b1b1b, roughness: 0.2, metalness: 0.3 });
    const wheelMat = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.85 });

    function box(w, h, d, mat) {
      const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
      m.castShadow = true;
      return m;
    }

    // Main body (red)
    const body = box(1.7, 0.45, 3.4, red);
    body.position.y = 0.55;
    carGroup.add(body);

    // White stripe down the centre
    const stripe = box(0.45, 0.02, 3.4, white);
    stripe.position.y = 0.79;
    carGroup.add(stripe);

    // Nose (red) + front wing (white)
    const nose = box(1.3, 0.35, 1.0, red);
    nose.position.set(0, 0.5, 1.9);
    carGroup.add(nose);
    const frontWing = box(1.9, 0.12, 0.6, white);
    frontWing.position.set(0, 0.35, 2.15);
    carGroup.add(frontWing);

    // Cockpit (dark)
    const cockpit = box(1.0, 0.4, 1.3, dark);
    cockpit.position.set(0, 0.95, -0.2);
    carGroup.add(cockpit);

    // Rear wing (white)
    const rearWing = box(1.7, 0.14, 0.5, white);
    rearWing.position.set(0, 1.05, -2.0);
    carGroup.add(rearWing);
    const supportL = box(0.15, 0.6, 0.3, dark);
    supportL.position.set(-0.5, 0.75, -2.0);
    const supportR = box(0.15, 0.6, 0.3, dark);
    supportR.position.set(0.5, 0.75, -2.0);
    carGroup.add(supportL, supportR);

    // Wheels
    const cylGeo = new THREE.CylinderGeometry(0.4, 0.4, 0.32, 16);
    function makeWheel() {
      const steer = new THREE.Group();
      const roll = new THREE.Group();
      steer.add(roll);
      const mesh = new THREE.Mesh(cylGeo, wheelMat);
      mesh.rotation.z = Math.PI / 2;
      mesh.castShadow = true;
      roll.add(mesh);
      return { steer, roll };
    }

    const wheels = {
      fl: makeWheel(), fr: makeWheel(),
      rl: makeWheel(), rr: makeWheel(),
    };
    wheels.fl.steer.position.set(-0.85, 0.4, 1.25);
    wheels.fr.steer.position.set(0.85, 0.4, 1.25);
    wheels.rl.steer.position.set(-0.85, 0.4, -1.25);
    wheels.rr.steer.position.set(0.85, 0.4, -1.25);
    for (const k in wheels) carGroup.add(wheels[k].steer);

    scene.add(carGroup);

    // ---------- Game state ----------
    const car = { x: 0, z: 0, yaw: 0, speed: 0, steer: 0 };
    const startPos = curve.getPointAt(0);
    const startTan = curve.getTangentAt(0);
    car.x = startPos.x;
    car.z = startPos.z;
    car.yaw = Math.atan2(startTan.x, startTan.z);

    const N = 40;
    const checkpoints = [];
    for (let i = 0; i < N; i++) {
      const p = curve.getPointAt(i / N);
      checkpoints.push({ x: p.x, z: p.z });
    }

    let nextCp = 1;
    let started = false;
    let finished = false;
    let startTime = 0;
    let endTime = 0;

    const timerEl = document.getElementById('timer');
    const statusEl = document.getElementById('status');
    const barEl = document.getElementById('bar');

    const ACCEL = 18, BRAKE = 30, MAX_SPEED = 45, MAX_REV = 14, STEER_RATE = 2.2, DRAG = 0.02;

    function isOffTrack() {
      let min = Infinity;
      for (const s of trackSamples) {
        const d = (car.x - s.x) ** 2 + (car.z - s.z) ** 2;
        if (d < min) min = d;
      }
      return Math.sqrt(min) > (roadWidth / 2 + 0.5);
    }

    function finishLap() {
      finished = true;
      endTime = (performance.now() - startTime) / 1000;
      statusEl.textContent = '🏁 Lap complete! Time: ' + endTime.toFixed(2) + 's — press R to restart';
      statusEl.style.color = '#ffd700';
    }

    function restart() {
      car.x = startPos.x;
      car.z = startPos.z;
      car.yaw = Math.atan2(startTan.x, startTan.z);
      car.speed = 0;
      car.steer = 0;
      nextCp = 1;
      started = false;
      finished = false;
      statusEl.textContent = 'Use WASD to drive';
      statusEl.style.color = '#fff';
      timerEl.textContent = '0.00s';
      barEl.style.width = '0%';
    }

    // ---------- Input ----------
    const keys = {};
    addEventListener('keydown', e => {
      const k = e.key.toLowerCase();
      keys[k] = true;
      if (['w', 'a', 's', 'd'].includes(k) && !started && !finished) {
        started = true;
        startTime = performance.now();
      }
      if (k === 'r') restart();
    });
    addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });
    addEventListener('resize', () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    });

    // ---------- Main loop ----------
    const clock = new THREE.Clock();
    const camDesired = new THREE.Vector3();

    function updateCar(dt) {
      const fwd = keys['w'] || keys['arrowup'];
      const back = keys['s'] || keys['arrowdown'];
      const left = keys['a'] || keys['arrowleft'];
      const right = keys['d'] || keys['arrowright'];

      if (fwd) car.speed += ACCEL * dt;
      else if (back) car.speed -= BRAKE * dt;
      else car.speed -= car.speed * DRAG * dt * 60;

      car.speed = Math.max(-MAX_REV, Math.min(MAX_SPEED, car.speed));

      let steer = 0;
      if (left) steer -= 1;
      if (right) steer += 1;
      car.steer = steer;

      const dir = Math.sign(car.speed) || 1;
      if (Math.abs(car.speed) > 0.5) {
        car.yaw += steer * STEER_RATE * dir * dt;
      }

      car.x += Math.sin(car.yaw) * car.speed * dt;
      car.z += Math.cos(car.yaw) * car.speed * dt;

      if (isOffTrack() && car.speed !== 0) {
        car.speed *= (1 - 1.8 * dt); // grass slows you down
      }

      // Checkpoints / lap detection
      if (!finished) {
        const cp = checkpoints[nextCp];
        if (Math.hypot(car.x - cp.x, car.z - cp.z) < 5) {
          nextCp++;
          if (nextCp >= N) {
            finishLap();
          }
        }
        barEl.style.width = Math.min(100, (nextCp / N) * 100) + '%';
      }
    }

    function updateCarVisuals(dt) {
      carGroup.position.set(car.x, 0, car.z);
      carGroup.rotation.y = car.yaw;

      wheels.fl.steer.rotation.y = car.steer * 0.4;
      wheels.fr.steer.rotation.y = car.steer * 0.4;
      for (const k in wheels) {
        wheels[k].roll.rotation.x -= (car.speed * dt) / 0.4;
      }
    }

    function updateCamera() {
      camDesired.set(
        car.x - Math.sin(car.yaw) * 9,
        4.6,
        car.z - Math.cos(car.yaw) * 9
      );
      camera.position.lerp(camDesired, 0.12);
      camera.lookAt(car.x, 1.2, car.z);
    }

    function updateTimer() {
      if (finished) return;
      if (started) {
        timerEl.textContent = ((performance.now() - startTime) / 1000).toFixed(2) + 's';
      }
    }

    camera.position.copy(camDesired.set(
      car.x - Math.sin(car.yaw) * 9, 4.6, car.z - Math.cos(car.yaw) * 9
    ));

    function animate() {
      const dt = Math.min(clock.getDelta(), 0.05);
      if (!finished) updateCar(dt);
      updateCarVisuals(dt);
      updateCamera();
      updateTimer();
      renderer.render(scene, camera);
      requestAnimationFrame(animate);
    }
    animate();
  </script>
</body>
</html>
